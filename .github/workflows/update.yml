name: update

# Refreshes yesterday and today of every provider, twice a day, and commits
# only when a file changed. After missed runs the window is widened to join
# the dates already published, so the gap is re-read; a bank's correction
# of a rate older than yesterday is not picked up.
#
# 06:00 UTC: NBK, CBR (~12:30 UTC) and NBG (~13:00 UTC) set today's rates
# the day before. 18:00 UTC: ECB (~14:00–15:00 UTC, 16:00 CET) and CBA
# (during the Yerevan working day) have published today's rates too.
# History is filled in by hand with backfill.yml.

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates-update # shared with backfill.yml: never two writers at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test the parsers
        run: npm test

      - name: Update rates
        id: update
        continue-on-error: true # still commit what the other providers fetched
        run: node scripts/update.mjs --days 1

      - name: Commit changes
        if: always() && steps.update.outcome != 'skipped'
        run: |
          for d in v1 raw; do [ -e "$d" ] && git add --all -- "$d"; done
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet --message "rates: update $(date -u '+%F %H:%M') UTC"
          git push || (git pull --rebase && git push)

      - name: Fail if a provider failed
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::At least one provider failed; see the 'Update rates' log. Its files were left untouched."
          exit 1
