name: backfill

# Fetches one calendar year and commits it. Run it once per year, newest
# first (2026, 2025, …): per-day banks (NBG, NBK, CBR) need one request per
# day at ≤ 2 per second, ~3 minutes a year (they run in parallel).
#
# Each bank's window is widened to join the dates it already has, so a
# year far from them would quietly fetch every year in between. Such a bank
# fails without fetching anything (--max-years 2) and names the year to run
# first; the other banks still run. Once a bank has its history start
# (2019-12-24), an earlier year does nothing for it. A failed year writes
# nothing for that bank: run the same year again.

on:
  workflow_dispatch:
    inputs:
      year:
        description: Year (YYYY), newest first, next to the years already fetched
        required: true
        type: string
      provider:
        description: Provider
        required: true
        default: all
        type: choice
        options: [all, ecb, nbg, nbk, cba, cbr]

permissions:
  contents: write

concurrency:
  group: rates-update # shared with update.yml: never two writers at once
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the year
        env:
          YEAR: ${{ inputs.year }}
        run: |
          if ! [[ "$YEAR" =~ ^[0-9]{4}$ ]] || [ "$YEAR" -gt "$(date -u +%Y)" ]; then
            echo "::error::Year must be four digits and not in the future, got '$YEAR'."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test the parsers
        run: npm test

      - name: Backfill
        id: update
        continue-on-error: true
        timeout-minutes: 20 # on the step, so the commit below still runs
        env:
          YEAR: ${{ inputs.year }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          args=(--from "$YEAR-01-01" --to "$YEAR-12-31" --max-years 2)
          [ "$PROVIDER" != all ] && args+=(--provider "$PROVIDER")
          node scripts/update.mjs "${args[@]}"

      - name: Commit changes
        if: always() && steps.update.outcome != 'skipped'
        env:
          YEAR: ${{ inputs.year }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          for d in v1 raw; do [ -e "$d" ] && git add --all -- "$d"; done
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet --message "rates: backfill ${PROVIDER} ${YEAR}"
          git push || (git pull --rebase && git push)

      - name: Fail if a provider failed
        if: always() && (steps.update.outcome == 'failure' || steps.update.outcome == 'cancelled')
        run: |
          echo "::error::At least one provider failed; see the 'Backfill' log. Run the same year again, or first the year it names."
          exit 1
